<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Diagnostic Quizzes</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <section class="card" id="quiz-card">
      <div id="menu-view">
        <a class="home-link" href="../">← Home</a>
        <h1 class="menu-title">Diagnostic Quizzes</h1>
        <p class="menu-subtitle">Choose a quiz to begin.</p>
        <div class="quiz-menu" id="quiz-menu"></div>
      </div>

      <div id="quiz-view" class="hidden">
        <div class="top-row">
          <div>
            <h1 class="quiz-title" id="quiz-title"></h1>
            <div class="quiz-meta" id="quiz-meta"></div>
          </div>
          <div class="question-count" id="question-count"></div>
        </div>

        <div class="progress-shell" aria-hidden="true">
          <div class="progress-bar" id="progress-bar"></div>
        </div>

        <p class="question" id="question-text"></p>
        <div class="options" id="options"></div>

        <div class="feedback" id="feedback">
          <div class="feedback-title" id="feedback-title"></div>
          <div id="feedback-text"></div>
        </div>

        <div class="actions">
          <button class="secondary-btn" id="back-btn">Back to menu</button>
          <button class="next-btn" id="next-btn">Next question</button>
        </div>
      </div>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script defer src="script.js"></script>
</body>
</html>
