<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBFAF6">
  <title>Diagnostic quizzes · Maths Interactives</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="page">
  <header class="site-header">
    <a class="brand" href="../"><img src="../assets/logo-mark.svg" alt=""><span>maths interactives</span></a>
    <nav class="site-nav" aria-label="Main"><a href="../">Home</a><a href="../interactives/">Tools</a><a href="./" aria-current="page">Quizzes</a></nav>
  </header>
  <main id="main" class="app">
    <section id="quiz-card">
      <div id="menu-view">
        <div class="menu-head">
          <div>
            <h1 class="page-title menu-title" id="menu-title">Diagnostic quizzes</h1>
            <p class="page-lede menu-subtitle" id="menu-subtitle">Choose a topic.</p>
          </div>
          <a class="results-link" href="results.html">Results dashboard</a>
        </div>
        <div class="quiz-menu topic-menu" id="quiz-menu"></div>
      </div>

      <div id="quiz-view" class="hidden card quiz-card">
        <div class="top-row">
          <div>
            <h1 class="quiz-title" id="quiz-title"></h1>
            <div class="quiz-meta" id="quiz-meta"></div>
          </div>
          <div class="question-count" id="question-count"></div>
        </div>
        <div class="progress-shell" aria-hidden="true"><div class="progress-bar" id="progress-bar"></div></div>
        <p class="question" id="question-text"></p>
        <div class="diagram-container hidden" id="diagram-container"></div>
        <div class="options" id="options"></div>
        <div class="feedback" id="feedback">
          <div class="feedback-title" id="feedback-title"></div>
          <div id="feedback-text"></div>
        </div>
        <div class="actions">
          <button class="secondary-btn" id="back-btn">Back to quizzes</button>
          <button class="next-btn" id="next-btn">Next question</button>
        </div>
      </div>
    </section>
  </main>
</div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
