<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBFAF6">
  <title>Results dashboard · Maths Interactives</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
  <link rel="stylesheet" href="../assets/brand.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="page">
  <header class="site-header">
    <a class="brand" href="../"><img src="../assets/logo-mark.svg" alt=""><span>maths interactives</span></a>
    <nav class="site-nav" aria-label="Main"><a href="../">Home</a><a href="../interactives/">Tools</a><a href="./">Quizzes</a></nav>
  </header>
  <main id="main" class="app">
    <h1 class="page-title">Results dashboard</h1>
    <p class="page-lede">Anonymous class summary, question by question.</p>
    <section class="card results-card">
      <div class="controls">
        <div class="control-group">
          <label for="quiz-select">Quiz</label>
          <select id="quiz-select"></select>
        </div>
        <div class="control-group">
          <label for="time-select">Time window</label>
          <select id="time-select">
            <option value="15">Last 15 minutes</option>
            <option value="30">Last 30 minutes</option>
            <option value="60" selected>Last 1 hour</option>
            <option value="today">Today</option>
          </select>
        </div>
        <button class="refresh-btn" id="refresh-btn">Refresh</button>
      </div>
      <div class="results-summary" id="results-summary"></div>
      <div id="results-output"></div>
    </section>
  </main>
</div>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/contrib/auto-render.min.js"></script>
  <script type="module" src="results.js"></script>
</body>
</html>
