<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#FBFAF6">
  <title>y = mx + c explorer · Maths Interactives</title>
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/brand.css">
  <style>
    .layout{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(280px,1fr);gap:24px;align-items:start}
    .graph-card{padding:12px}
    #graph{display:block;width:100%;height:auto}
    .side{display:flex;flex-direction:column;gap:16px}
    .equation{font-family:var(--serif);font-style:italic;font-weight:500;font-size:40px;line-height:1.1;text-align:center;padding:20px 16px;letter-spacing:-.5px}
    .control{padding:16px 18px}
    .control label{display:flex;justify-content:space-between;font-weight:600;margin-bottom:6px}
    .control output,.control span{font-variant-numeric:tabular-nums}
    .values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
    .value{padding:12px;text-align:center}
    .value .label{display:flex;align-items:center;justify-content:center;gap:6px}
    .value .dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
    .value strong{display:block;font-size:22px;font-variant-numeric:tabular-nums;margin-top:2px}
    @media (max-width:860px){.layout{grid-template-columns:1fr}.equation{font-size:32px}}
  </style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<div class="page">
  <header class="site-header">
    <a class="brand" href="../"><img src="../assets/logo-mark.svg" alt=""><span>maths interactives</span></a>
    <nav class="site-nav" aria-label="Main"><a href="../">Home</a><a href="./" aria-current="page">Tools</a><a href="../diagnostic-quizzes/">Quizzes</a></nav>
  </header>
  <main id="main">
    <h1 class="page-title">y = mx + c explorer</h1>
    <p class="page-lede">Move the sliders to see how the gradient and y-intercept change a straight line.</p>
    <div class="layout">
      <section class="card graph-card"><svg id="graph" viewBox="0 0 700 500" role="img" aria-label="Coordinate graph showing y equals mx plus c"></svg></section>
      <div class="side">
        <div class="card equation" id="equation" aria-live="polite">y = x</div>
        <div class="panel control">
          <label for="gradient">Gradient, m <span id="mValue">1</span></label>
          <input id="gradient" type="range" min="-5" max="5" step="0.1" value="1">
        </div>
        <div class="panel control">
          <label for="intercept">y-intercept, c <span id="cValue">0</span></label>
          <input id="intercept" type="range" min="-10" max="10" step="0.1" value="0">
        </div>
        <div class="values">
          <div class="panel value"><span class="label"><span class="dot" style="background:var(--blue)"></span>Gradient</span><strong id="gradientSummary">1</strong></div>
          <div class="panel value"><span class="label"><span class="dot" style="background:var(--red)"></span>y-int.</span><strong id="interceptSummary">0</strong></div>
          <div class="panel value"><span class="label"><span class="dot" style="background:var(--gold)"></span>x-int.</span><strong id="xInterceptSummary">0</strong></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script>
    const gradientInput = document.getElementById("gradient");
    const interceptInput = document.getElementById("intercept");
    const mValue = document.getElementById("mValue");
    const cValue = document.getElementById("cValue");
    const equation = document.getElementById("equation");
    const graph = document.getElementById("graph");
    const gradientSummary = document.getElementById("gradientSummary");
    const interceptSummary = document.getElementById("interceptSummary");
    const xInterceptSummary = document.getElementById("xInterceptSummary");
    const width = 700, height = 500, scale = 40, originX = width / 2, originY = height / 2;
    function formatNumber(num, decimals = 1) {
      const rounded = Number(num.toFixed(decimals));
      return Number.isInteger(rounded) ? String(rounded) : String(rounded);
    }
    function xToSvg(x) { return originX + x * scale; }
    function yToSvg(y) { return originY - y * scale; }
    function createSvgElement(type, attributes) {
      const element = document.createElementNS("http://www.w3.org/2000/svg", type);
      Object.entries(attributes).forEach(([key, value]) => element.setAttribute(key, value));
      return element;
    }
    function updateGraph() {
      const m = Number(gradientInput.value);
      const c = Number(interceptInput.value);
      mValue.textContent = formatNumber(m);
      cValue.textContent = formatNumber(c);
      gradientSummary.textContent = formatNumber(m);
      interceptSummary.textContent = formatNumber(c);
      const sign = c >= 0 ? "+" : "−";
      const absC = formatNumber(Math.abs(c));
      if (m === 1 && c === 0) equation.textContent = "y = x";
      else if (m === -1 && c === 0) equation.textContent = "y = −x";
      else if (c === 0) equation.textContent = `y = ${formatNumber(m)}x`;
      else if (m === 1) equation.textContent = `y = x ${sign} ${absC}`;
      else if (m === -1) equation.textContent = `y = −x ${sign} ${absC}`;
      else equation.textContent = `y = ${formatNumber(m)}x ${sign} ${absC}`;
      graph.innerHTML = "";
      for (let n = -10; n <= 10; n++) {
        graph.appendChild(createSvgElement("line", {x1:xToSvg(n), y1:0, x2:xToSvg(n), y2:height, stroke:"#E8ECF3", "stroke-width":1}));
        graph.appendChild(createSvgElement("line", {x1:0, y1:yToSvg(n), x2:width, y2:yToSvg(n), stroke:"#E8ECF3", "stroke-width":1}));
      }
      graph.appendChild(createSvgElement("line", {x1:0, y1:originY, x2:width, y2:originY, stroke:"#1B2A4A", "stroke-width":2}));
      graph.appendChild(createSvgElement("line", {x1:originX, y1:0, x2:originX, y2:height, stroke:"#1B2A4A", "stroke-width":2}));
      for (let n = -10; n <= 10; n++) {
        if (n !== 0) {
          const xLabel = createSvgElement("text", {x:xToSvg(n), y:originY+20, "text-anchor":"middle", "font-size":14, fill:"#4F5D7A", "font-family":"Inter, sans-serif"});
          xLabel.textContent = n; graph.appendChild(xLabel);
          const yLabel = createSvgElement("text", {x:originX-15, y:yToSvg(n)+5, "text-anchor":"middle", "font-size":14, fill:"#4F5D7A", "font-family":"Inter, sans-serif"});
          yLabel.textContent = n; graph.appendChild(yLabel);
        }
      }
      const points = [];
      for (let x = -10; x <= 10; x += 0.1) points.push(`${xToSvg(x)},${yToSvg(m*x+c)}`);
      graph.appendChild(createSvgElement("polyline", {fill:"none", stroke:"#2B63C6", "stroke-width":4, points:points.join(" ")}));
      graph.appendChild(createSvgElement("circle", {cx:xToSvg(0), cy:yToSvg(c), r:8, fill:"#D6453D", stroke:"#fff", "stroke-width":3}));
      if (m !== 0) {
        const xIntercept = -c / m;
        xInterceptSummary.textContent = formatNumber(xIntercept, 2);
        if (xIntercept >= -10 && xIntercept <= 10) graph.appendChild(createSvgElement("circle", {cx:xToSvg(xIntercept), cy:yToSvg(0), r:8, fill:"#C98A12", stroke:"#fff", "stroke-width":3}));
      } else {
        xInterceptSummary.textContent = c === 0 ? "all values" : "undefined";
      }
    }
    gradientInput.addEventListener("input", updateGraph);
    interceptInput.addEventListener("input", updateGraph);
    updateGraph();
  </script>
</body>
</html>
